services:
  postgres:
    image: postgres:16-alpine
    container_name: quizparty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizparty
      POSTGRES_PASSWORD: quizparty
      POSTGRES_DB: quizparty
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quizparty -d quizparty']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quizparty-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
